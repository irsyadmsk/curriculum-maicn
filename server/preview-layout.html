<!doctype html><html lang="id"><meta charset="utf-8"><title>Pemeriksaan tata letak lokal</title><style>body{margin:16px;font:14px system-ui;background:#eee;color:#10233c}form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}iframe{background:white;border:1px solid #aaa;height:780px}pre{white-space:pre-wrap}</style>
<h1>Pemeriksaan tata letak lokal · data contoh</h1>
<form id="controls"><label>Halaman <select id="page"><option>index.html</option><option>info-murid.html</option><option>klinik.html</option><option>kokurikuler.html</option><option>karakter.html</option><option>presensi.html</option><option>rapor.html</option><option>murid.html</option></select></label><label>Lebar <select id="width"><option>320</option><option>390</option><option>768</option><option>1366</option></select></label><button>Buka</button><button type="button" id="measure">Ukur</button></form>
<button type="button" id="sweep">Periksa ruang guru</button><pre id="sweep-result"></pre><output id="result">Belum diukur.</output><div style="overflow:auto"><iframe id="preview" title="Halaman pada lebar pengujian" width="320"></iframe></div>
<script>
const frame=document.getElementById('preview');
document.getElementById('controls').onsubmit=e=>{e.preventDefault();frame.style.width=document.getElementById('width').value+'px';frame.src='/'+document.getElementById('page').value;document.getElementById('result').textContent='Memuat…'};
function measure(){const d=frame.contentDocument,root=d.documentElement;const row={page:frame.contentWindow.location.pathname,requested:document.getElementById('page').value,width:root.clientWidth,contentWidth:root.scrollWidth,ready:d.body.classList.contains('access-ready'),role:d.body.dataset.audience,overflow:root.scrollWidth>root.clientWidth+1};document.getElementById('result').textContent=JSON.stringify(row)}
document.getElementById('measure').onclick=measure;
frame.onload=()=>{let tries=0;const check=setInterval(()=>{const d=frame.contentDocument;if(d.body.classList.contains('access-ready')||++tries>120){clearInterval(check);requestAnimationFrame(()=>requestAnimationFrame(measure))}},100)};
document.getElementById('sweep').onclick=async()=>{const button=document.getElementById('sweep');button.disabled=true;const results=[];for(const page of ['karakter.html','presensi.html','rapor.html','murid.html'])for(const width of ['320','390','1366']){document.getElementById('page').value=page;document.getElementById('width').value=width;document.getElementById('controls').requestSubmit();await new Promise(resolve=>{const observer=new MutationObserver(()=>{const text=document.getElementById('result').textContent;if(text.startsWith('{')){observer.disconnect();resolve()}});observer.observe(document.getElementById('result'),{childList:true})});results.push(JSON.parse(document.getElementById('result').textContent));document.getElementById('sweep-result').textContent=JSON.stringify({completed:results.length,results},null,2)}button.disabled=false};
</script></html>
